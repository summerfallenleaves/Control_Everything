[project]
name = "control-everything"
version = "0.1.0"
description = "自主 GUI Agent：控制手机与电脑（macOS/Android/iOS）完成用户任务"
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "anthropic>=0.122.0",
    "openai>=3.1.0",
    "pillow>=12.3.0",
    "pyobjc-framework-applicationservices>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2.2 ; sys_platform == 'darwin'",
    "python-dotenv>=1.2.2",
]
